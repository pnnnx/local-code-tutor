name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Зависимости (torch на CPU)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install safetensors matplotlib numpy pandas pytest
      - name: Модули датасета компилируются
        run: python -m py_compile ds/tools/*.py ds/eval_set.py wtools/*.py
      - name: Тесты wtools
        run: python -m pytest -q wtools/test_weights.py
